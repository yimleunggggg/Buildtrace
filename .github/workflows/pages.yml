name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "bin/buildtrace.mjs"
      - "docs/buildtrace/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test and validate public demo
        run: |
          npm test
          node bin/buildtrace.mjs publish --profile public --target . --output _site
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module - <<'NODE'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
          });
          if (!response.ok && response.status !== 404) throw new Error(`Pages configuration check failed: HTTP ${response.status}`);
          const site = response.ok ? await response.json() : null;
          const enabled = site?.build_type === 'workflow';
          appendFileSync(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          if (!enabled) {
            console.log('::notice::Public demo validated but NOT deployed. Enable Settings > Pages > Source: GitHub Actions, then rerun this workflow.');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Public demo validated. Deployment skipped: Pages is absent or not configured for GitHub Actions. Enable it in repository Settings > Pages, then rerun.\n');
          }
          NODE
  deploy:
    needs: check
    if: needs.check.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Generate redacted public snapshot
        run: node bin/buildtrace.mjs publish --profile public --target . --output _site

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
